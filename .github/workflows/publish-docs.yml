name: Deploy docs

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: SciCatProject/docs-template/.github/actions/mkdocs-pages@062778348b1e0daf6ac3af5ff4b73c97dff7f8b9 # main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          push: true
          docs_folder: ''
